# The test board on Rich's phone (AII-67): test.aigile.lol sends the app's calls to the ssh tunnel from the PC
# (testboard.mjs phone opens it: the server's 127.0.0.1:4610 is the PC's test board). The site's own pages stay as they are.
# Host stays test.aigile.lol, so the board lets these calls in only for a paired phone.
location /api/ {
	proxy_pass http://127.0.0.1:4610;
	proxy_set_header Host $host;
	proxy_buffering off;
	proxy_read_timeout 1h;
	client_max_body_size 25m;
}
location /media/ {
	proxy_pass http://127.0.0.1:4610;
	proxy_set_header Host $host;
	client_max_body_size 25m;
}
